<div class="layout">
    <aside class="layout__sidebar">
        <div class="layout__sidebar__logo">MoneyFlow</div>

        <nav class="layout__sidebar__nav">
            <button class="btn nav-item" (click)="navigate('dashboard')" [class.active]="currentPage() === 'dashboard'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span>Главная</span>
            </button>
            <button class="btn nav-item" (click)="navigate('transaction')" [class.active]="currentPage() === 'transaction'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left-right"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                <span>Транзакции</span>
            </button>
            <button class="btn nav-item" (click)="navigate('budget')" [class.active]="currentPage() === 'budget'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-piggy-bank"><path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/><path d="M16 10h.01"/><path d="M2 8v1a2 2 0 0 0 2 2h1"/></svg>
                <span>Бюджет</span>
            </button>
            <button class="nav-item" (click)="navigate('debt')" [class.active]="currentPage() === 'debt'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hand-coins" aria-hidden="true"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"></path><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path><path d="m2 16 6 6"></path><circle cx="16" cy="9" r="2.9"></circle><circle cx="6" cy="5" r="3"></circle></svg>
                <span>Долги</span>
            </button>
            <button class="nav-item" (click)="navigate('account')" [class.active]="currentPage() === 'account'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></svg>
                <span>Счета</span>
            </button>
        </nav>

        <div class="layout__sidebar__footer">v1.0.0</div>
    </aside>

    <div class="layout__backdrop"></div>

    <div class="layout__main">
        <header class="layout__main__topbar">
            <button class="btn btn--icon">
                @if (isSidebarExpanded()) {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m14 16-4-4 4-4"/></svg>
                }
                @else {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m10 8 4 4-4 4"/></svg>
                }
            </button>
            <h1 class="layout__main__topbar__title">{{title()}}</h1>
            <div class="layout__main__topbar__spacer"></div>

            <div class="layout__main__user">
                <button class="btn btn--add">+ Транзакции</button>
                <span class="layout__main__user__balance"></span>
                <span class="layout__main__user__avatar"></span>
                <!-- <span class="layout__main__user__name">Name</span> -->
                <button class="btn btn--primary">Выйти</button>
            </div>
        </header>

        <main class="layout__main__content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
