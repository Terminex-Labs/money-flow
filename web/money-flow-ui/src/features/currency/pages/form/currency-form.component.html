<div class="main">
    <span class="main__title">{{ getTitle() }}</span>

    <div class="main__form">
        <div class="main__form__field">
            <span>Код</span>
            <input class="input" placeholder="USD - EUR - RUB" 
                [value]="data().shortName"
                (input)="data.update(currency => ({ ...currency, shortName: $any($event.target).value }))">
        </div>
        
        <div class="main__form__field">
            <span>Символ</span>
            <input class="input" placeholder="$ - € - ₽" 
                [value]="data().unicode" 
                (input)="data.update(currency => ({ ...currency, unicode: $any($event.target).value }))">
        </div>
        
        <div class="main__form__field">
            <span>Наименование</span>
            <input class="input" placeholder="US Dollars - Euro - Russian Ruble" 
                [value]="data().fullName" 
                (input)="data.update(currency => ({ ...currency, fullName: $any($event.target).value }))">
        </div>
    </div>

    <div class="main__btn">
        <button class="btn main__btn__delete" (click)="onCancellation()">Отмена</button>

        <button class="btn btn--add main__btn__add" 
                (click)="onSave()" 
                [disabled]="isLoading()">
            {{ getButtonText() }}
        </button>
    </div>
</div>
