<div class="main">
    <div class="datagrid">
        <!-- Заголовок таблицы -->
        <div class="datagrid__header">
            <div class="datagrid__col datagrid__col--shortname">ShortName</div>
            <div class="datagrid__col datagrid__col--unicode">Unicode</div>
            <div class="datagrid__col datagrid__col--fullname">FullName</div>

             <div class="datagrid__col datagrid__col--action">
                <button class="btn btn--add" (click)="onCreate()">+ Новая Валюта</button>
             </div>
        </div>

        <!-- Тело таблицы -->
        <div class="datagrid__body">
            @for (item of currencies(); track item.id) {
                <div class="datagrid__row" 
                     [class.datagrid__row--selected]="selectedCurrency()?.id == item.id"
                     (click)="selectedCurrency.set(item)">
                    <div class="datagrid__col datagrid__col--shortname">{{ item.shortName }}</div>
                    <div class="datagrid__col datagrid__col--unicode">{{ item.unicode }}</div>
                    <div class="datagrid__col datagrid__col--fullname">{{ item.fullName }}</div>

                    <div class="datagrid__col datagrid__col--action">
                        <div class="main__topbar">
                            <div class="main__topbar__menu">
                                <button class="btn btn--icon btn-action" title="Редактировать" (click)="onEditBtn()">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil preview-icon"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                                </button>
                                <button class="btn btn--icon btn-action" title="Удалить" (click)="onDeleteBtn()">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash preview-icon"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            } @empty {
                <div class="datagrid__empty">
                    <p>Нет доступных счетов</p>
                </div>
            }
        </div>
    </div>
</div>
