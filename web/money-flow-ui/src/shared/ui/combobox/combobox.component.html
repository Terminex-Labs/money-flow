<div class="combobox-wrapper">
    <!-- Триггер -->
    <div cdkOverlayOrigin #trigger="cdkOverlayOrigin" class="combobox-trigger" [class.disabled]="disabled"
        [class.ng-invalid]="ngControl?.invalid && ngControl?.touched" [class.ng-touched]="ngControl?.touched"
        (click)="toggleDropdown()" (keydown.enter)="toggleDropdown()"
        (keydown.space)="toggleDropdown(); $event.preventDefault()" tabindex="0" role="combobox"
        [attr.aria-expanded]="isOpen()" [attr.aria-haspopup]="true">
        <span class="combobox-value" [class.placeholder]="!hasValue()">
            {{ hasValue() ? selectedLabel() : placeholder }}
        </span>
        <span class="combobox-arrow"></span>
    </div>

    <!-- Dropdown -->
    @if (isOpen()) {
    <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
        [cdkConnectedOverlayPositions]="positions" [cdkConnectedOverlayHasBackdrop]="true"
        [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
        (backdropClick)="isOpen.set(false)" (detach)="isOpen.set(false)">
        <div class="combobox-dropdown" cdkListbox [cdkListboxValue]="selectedValue() ? [selectedValue()] : []"
            (cdkListboxValueChange)="onListboxChange($event)" [style.width.px]="triggerWidth()">
            @for (option of options; track option) {
            <div [cdkOption]="option.value" class="combobox-option">
                {{ option.label }}
            </div>
            }
        </div>
    </ng-template>
    }
</div>
